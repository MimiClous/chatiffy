name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Node runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://nodejs.org/dist/v24.22.1/node-v24.22.1-win-x64.zip -OutFile "$env:RUNNER_TEMP\node.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\node.zip").Hash.ToLowerInvariant() -ne 'd2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5') { throw 'Node checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\node.zip" "$env:RUNNER_TEMP\node"
          "$env:RUNNER_TEMP\node\node-v24.22.1-win-x64" >> $env:GITHUB_PATH
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Check and test server
        run: |
          pnpm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
      - name: Build portable application
        run: ./scripts/build-windows.ps1
      - name: Test packaged application
        run: ./scripts/test-windows.ps1
      - name: Test updater validation
        shell: powershell
        run: ./scripts/test-updater.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Chatiffy-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version' }
          gh release create $env:GITHUB_REF_NAME dist/*.zip dist/*.sha256 --verify-tag --title "Chatiffy $version" --notes-file windows/RELEASE.md
      - name: Consolidate superseded release pages (keep Git tags)
        if: github.ref == 'refs/tags/v1.4.5'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v1.4.5 --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'New release is not published; keep previous releases' }
          foreach ($tag in @('v1.4.2', 'v1.4.3', 'v1.4.4')) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove superseded release $tag" }
          }
