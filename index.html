<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatiffy — Twitch Chat Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="chat" aria-live="polite"></section>
    <div id="connectionBadge"><span class="loader"><i></i></span><span id="status">Подключение…</span></div>
    <button id="settingsButton" title="Настройки">⚙</button>
    <aside id="settings" hidden>
      <h1>Chatiffy</h1>
      <label>Канал Twitch <input id="channelInput" value="zakvielchannel" autocomplete="off" maxlength="25" pattern="[A-Za-z0-9_]+"></label>
      <label>Размер текста <input id="fontSizeInput" type="range" min="16" max="48" value="28"><output id="fontSizeOutput">28 px</output></label>
      <label>Сообщение видно <input id="lifetimeInput" type="range" min="0" max="120" value="0"><output id="lifetimeOutput">всегда</output></label>
      <label>Максимум сообщений <input id="maxMessagesInput" type="number" min="5" max="30" value="9"></label>
      <label>Стиль
        <select id="themeInput">
          <option value="glass">Стекло</option>
          <option value="clean">Чистый</option>
          <option value="neon">Неон</option>
        </select>
      </label>
      <label>Выравнивание
        <select id="alignInput">
          <option value="left">Слева</option>
          <option value="right">Справа</option>
        </select>
      </label>
      <label>Цвет текста <input id="textColorInput" type="color" value="#ffffff"></label>
      <label>Прозрачность панели <input id="panelOpacityInput" type="range" min="0" max="80" value="32"><output id="panelOpacityOutput">32%</output></label>
      <label>Сила виньетки <input id="vignetteInput" type="range" min="0" max="100" value="55"><output id="vignetteOutput">55%</output></label>
      <label>Скругление <input id="radiusInput" type="range" min="0" max="40" value="24"><output id="radiusOutput">24 px</output></label>
      <label class="check"><input id="backgroundInput" type="checkbox"> Отдельные подложки сообщений</label>
      <div class="presets" aria-label="Готовые стили">
        <button type="button" data-preset="soft">Мягкий</button>
        <button type="button" data-preset="compact">Компактный</button>
        <button type="button" data-preset="neon">Неон</button>
        <button type="button" data-preset="transparent">Без фона</button>
      </div>
      <button id="applyButton">Применить и подключиться</button>
      <button id="copyButton" type="button">Скопировать ссылку для OBS</button>
      <label class="stack">Готовая OBS-ссылка <input id="overlayUrlOutput" readonly></label>
      <p>В OBS добавьте источник «Браузер» и вставьте готовую ссылку в поле URL. Рекомендуемый размер: 600 × 900.</p>
      <p id="debug"></p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
